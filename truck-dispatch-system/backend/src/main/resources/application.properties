# ============================================================
# 运输车辆调度优化与仿真 - Spring Boot 配置文件
# ============================================================

# ---------- 应用基础信息 ----------
spring.application.name=transport-dispatch-backend

# ---------- MySQL 数据源 ----------
# transport 库由 database/schema_v2.sql 自动创建；如 MySQL 密码不同请修改下面两行
# 说明：本机为 XAMPP 自带 MariaDB，root 默认空密码；独立安装的 MySQL 通常为 root/123456 等
spring.datasource.url=jdbc:mysql://localhost:3306/transport?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JSON 时间格式（北京时间） ----------
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ---------- 后端服务端口（前端 http.js 中的 baseURL 必须与此一致） ----------
server.port=8888

# ============================================================
# 仿真引擎参数（com.example.transport.service.SimulationEngine 使用）
# ============================================================
# 每个仿真节拍的真实时间间隔（毫秒）
transport.sim.tick-ms=2000
# 一个节拍代表的仿真分钟数（2 秒真实时间 ≈ 仿真世界 5 分钟）
transport.sim.minutes-per-tick=5
# 每 N 个节拍向 gps_data 表落一次 GPS 轨迹（车辆多时可调大以减轻写库压力）
transport.sim.gps-every-n-ticks=1

# ============================================================
# 高德开放平台（可选）
# 申请地址 https://console.amap.com/  ->  Web 服务 Key
# 留空时 GIS 服务自动退化为本地 Haversine 直线距离估算，不影响仿真运行
# ============================================================
transport.amap.key=
