# ============================================================
# 运输车辆调度优化与仿真 - Spring Boot 配置文件
# ============================================================

# ---------- 应用基础信息 ----------
spring.application.name=transport-dispatch-backend

# ---------- MySQL 数据源 ----------
# transport 库由 database/schema_v2.sql 自动创建；如 MySQL 密码不同请修改下面两行
# 说明：本机为 XAMPP 自带 MariaDB，root 默认空密码；独立安装的 MySQL 通常为 root/123456 等
spring.datasource.url=jdbc:mysql://localhost:3306/transport?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JSON 时间格式（北京时间） ----------
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ---------- 后端服务端口（前端 http.js 中的 baseURL 必须与此一致） ----------
server.port=8888

# ============================================================
# 仿真引擎参数（com.example.transport.service.SimulationEngine 使用）
# ============================================================
# 每个仿真节拍的真实时间间隔（毫秒）
transport.sim.tick-ms=2000
# 一个节拍代表的仿真分钟数（2 秒真实时间 ≈ 仿真世界 5 分钟）
transport.sim.minutes-per-tick=5
# 每 N 个节拍向 gps_data 表落一次 GPS 轨迹（车辆多时可调大以减轻写库压力）
transport.sim.gps-every-n-ticks=1

# ============================================================
# 高德开放平台（可选）
# 申请地址 https://console.amap.com/  ->  Web 服务 Key
# 留空时 GIS 服务自动退化为本地 Haversine 直线距离估算，不影响仿真运行
# 注意：必须是"Web服务"类型的 Key，不是"Web前端(JS API)"类型
# ============================================================
transport.amap.key=b3b6dcf6c1c7e590b664064feea5f56c

# ============================================================
# 高德货车路径规划（v4/direction/truck）
# 说明：货车规划是物流 API 收费接口，需为上面的 Key 单独开通权限
# （https://console.amap.com/dev/ticket/type/others 提交商务合作类工单）。
# 未开通时后端自动降级为驾车规划（v3），并在权限开通后按需把旧驾车路线升级为货车路线。
# 车辆档案为全局配置：路线按起终点在 route 表共享缓存，不按车辆区分。
# ============================================================
# 是否启用货车路径规划（false 则始终用驾车规划）
transport.amap.truck.enabled=true
# 车辆大小：1微型 / 2轻型 / 3中型 / 4重型
transport.amap.truck.size=4
# 车辆高度(米)，用于限高规避
transport.amap.truck.height=4.0
# 车辆宽度(米)，用于限宽规避
transport.amap.truck.width=2.55
# 车辆总重(吨) = 核定载重 + 自重，用于限重规避
transport.amap.truck.load=31
# 核定载重(吨)
transport.amap.truck.weight=18
# 轴数，影响通行费计算
transport.amap.truck.axis=4
# 规划策略：10=无路况速度优先（结果稳定，适合仿真）；11=高德推荐（含实时路况）
transport.amap.truck.strategy=10
